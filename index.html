<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cusion — Нэвтрэх</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f5f3ff 0%,#ede9fe 100%);font-family:'DM Sans',Arial,sans-serif}
  .card{background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(83,74,183,.13);padding:40px 36px;width:100%;max-width:400px}
  .logo{text-align:center;margin-bottom:8px}
  .logo-icon{width:56px;height:56px;background:linear-gradient(135deg,#534AB7,#E8A0B4);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:26px;color:#fff;margin-bottom:12px}
  .logo h1{font-size:22px;font-weight:700;color:#1A1814;letter-spacing:-.5px}
  .logo p{font-size:13px;color:#888;margin-top:2px}
  .form{margin-top:28px}
  .fl{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
  label{font-size:12px;font-weight:600;color:#555;text-transform:uppercase;letter-spacing:.5px}
  input{border:1.5px solid #E2DDD5;border-radius:8px;padding:11px 14px;font-size:14px;outline:none;transition:.2s;background:#faf9f7;color:#1A1814}
  input:focus{border-color:#534AB7;background:#fff;box-shadow:0 0 0 3px rgba(83,74,183,.08)}
  .btn{width:100%;background:linear-gradient(135deg,#534AB7,#6B5FCA);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;margin-top:8px;letter-spacing:.3px}
  .btn:hover{opacity:.92;transform:translateY(-1px)}
  .btn:disabled{opacity:.6;transform:none;cursor:not-allowed}
  .err{background:#FDE8E8;color:#C53030;border-radius:8px;padding:10px 14px;font-size:13px;margin-top:12px;display:none}
  .spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .footer{text-align:center;margin-top:20px;font-size:12px;color:#aaa}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-package"></i></div>
    <h1>Cusion</h1>
    <p>Борлуулалтын систем</p>
  </div>
  <div class="form">
    <div class="fl">
      <label>И-мэйл хаяг</label>
      <input type="email" id="email" placeholder="example@gmail.com" autocomplete="email">
    </div>
    <div class="fl">
      <label>Нууц үг</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="btn" onclick="doLogin()">Нэвтрэх</button>
    <div class="err" id="err"></div>
  </div>
  <div class="footer">Cusion © 2025</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBGQe6_1WwhC06_hGyNpZh_cFTMFKTJYJQ",
  authDomain: "cusion.firebaseapp.com",
  projectId: "cusion",
  storageBucket: "cusion.firebasestorage.app",
  messagingSenderId: "400511203197",
  appId: "1:400511203197:web:353486e6a71b61d8dcfe14"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Аль хэдийн нэвтэрсэн бол шилжүүлэх
onAuthStateChanged(auth, user => {
  if (user) window.location.href = 'app.html';
});

window.doLogin = async () => {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.style.display = 'none';
  if (!email || !pass) { showErr('И-мэйл болон нууц үгээ оруулна уу'); return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Нэвтэрч байна...';
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.href = 'app.html';
  } catch(e) {
    const msgs = {
      'auth/wrong-password': 'Нууц үг буруу байна',
      'auth/user-not-found': 'Тэр и-мэйл хаяг бүртгэлгүй байна',
      'auth/invalid-email': 'И-мэйл хаяг буруу байна',
      'auth/too-many-requests': 'Хэт олон удаа оролдлоо. Түр хүлээнэ үү',
      'auth/invalid-credential': 'И-мэйл эсвэл нууц үг буруу байна',
    };
    showErr(msgs[e.code] || 'Нэвтрэхэд алдаа гарлаа: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = 'Нэвтрэх';
  }
};

function showErr(msg) {
  const err = document.getElementById('err');
  err.textContent = msg;
  err.style.display = 'block';
}

// Enter товч
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
